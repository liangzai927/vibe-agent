[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-agent"
version = "0.1.0"
description = "一个从零构建的终端编码 agent"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["openai>=1.40"]

[project.scripts]
va = "va.cli:main"

[tool.setuptools.packages.find]
include = ["va*"]
